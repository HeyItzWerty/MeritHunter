<!DOCTYPE html>
<html lang="en">

    <style>
        /* Gritty Dossier Background */
        body { background-color: #161616; background-image: url('https://www.transparenttextures.com/patterns/stardust.png'); color: #ccc; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        
        .torn-card { transition: all 0.2s ease; background-color: #1a1a1a; }
        .torn-card:hover { transform: translateY(-2px); z-index: 10; background-color: #1e1e1e; }
        
        /* Difficulty Color Mapping */
        .diff-1, .diff-2 { color: #4ade80; border-color: #333; }
        .diff-3, .diff-4 { color: #a3e635; border-color: #333; }
        .diff-5, .diff-6 { color: #fbbf24; border-color: #333; }
        .diff-7, .diff-8 { color: #f97316; border-color: #333; }
        .diff-9, .diff-10 { color: #ef4444; border-color: #333; }

        .diff-1:hover, .diff-2:hover { border-color: #4ade80; box-shadow: 0 0 10px rgba(74, 222, 128, 0.1); }
        .diff-3:hover, .diff-4:hover { border-color: #a3e635; box-shadow: 0 0 10px rgba(163, 230, 53, 0.1); }
        .diff-5:hover, .diff-6:hover { border-color: #fbbf24; box-shadow: 0 0 10px rgba(251, 191, 36, 0.1); }
        .diff-7:hover, .diff-8:hover { border-color: #f97316; box-shadow: 0 0 10px rgba(249, 115, 22, 0.1); }
        .diff-9:hover, .diff-10:hover { border-color: #ef4444; box-shadow: 0 0 10px rgba(239, 68, 68, 0.1); }

        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #111; }
        ::-webkit-scrollbar-thumb { background: #444; border-radius: 4px;}
        ::-webkit-scrollbar-thumb:hover { background: #666; }
        
        .loader { border: 3px solid #333; border-top: 3px solid #888; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin: 20px auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* Custom Number Input Hiding */
        input[type=number]::-webkit-inner-spin-button, 
        input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
    </style>
</head>

                    </select>
                </div>
                <div>
                    <label class="block text-[10px] text-gray-500 mb-1 font-bold uppercase">Crime Filter</label>
                    <select id="crime-filter" onchange="renderMerits()" class="w-full bg-[#1a1a1a] text-xs text-white p-2.5 border border-[#444] outline-none rounded">
                        <option value="all">Show All Crimes</option>
                        <option value="crime1">Crimes 1.0 Only</option>
                        <option value="crime2">Crimes 2.0 Only</option>
                        <option value="nocrime">Exclude All Crimes</option>
                    </select>
                </div>
                <div>
                    <label class="block text-[10px] text-gray-500 mb-1 font-bold uppercase">Sort Protocol</label>
                    <select id="sort-filter" onchange="renderMerits()" class="w-full bg-[#1a1a1a] text-xs text-white p-2.5 border border-[#444] outline-none rounded">
                        <option value="difficulty_asc">Easiest First</option>
                        <option value="difficulty_desc">Hardest First</option>
                        <option value="name">Alphabetical</option>
                    </select>
                </div>

                    </label>
                    <label class="flex items-center space-x-2 cursor-pointer group">

                        <span class="text-xs text-gray-400 group-hover:text-white font-bold uppercase transition-colors">Show Hidden Merits</span>
                    </label>
                </div>
            </div>
        </div>

        <div id="stats-bar" class="hidden mb-6 flex justify-between text-xs text-gray-500 px-2 font-bold uppercase tracking-wider">

        </div>

        function getCrimeVersion(desc) {
            const lower = desc.toLowerCase();
            const c2Keywords = ["skill level of 100", "bootlegging", "graffiti", "shoplifting", "pickpocket", "skimming", "burglary", "hustling", "disposal", "cracking", "forgery", "scamming", "rotten food", "dead body in acid", "password characters", "dvd store", "police officer's badge"];
            if (c2Keywords.some(kw => lower.includes(kw))) return 2;
            
            const c1Keywords = ["thefts crimes", "drug deals crimes", "computer crimes", "murders crimes", "fraud crimes", "auto theft crimes", "other\" crimes", "selling illegal products crimes"];
            if (c1Keywords.some(kw => lower.includes(kw))) return 1;
            
            return null;
        }

        let GLOBAL_MERITS = []; 
        let USER_OWNED_IDS = new Set(); 
        let CATEGORIES = new Set();

        async function fetchMerits() {
            const apiKey = document.getElementById('api-key').value.trim();
            if (!apiKey) { alert("Please enter a valid API Key."); return; }
            
            document.getElementById('loader').classList.remove('hidden'); 
            document.getElementById('merit-list').innerHTML = ''; 
            document.getElementById('empty-state').classList.add('hidden'); 
            document.getElementById('fetch-btn').disabled = true; 
            document.getElementById('fetch-btn').innerText = "Fetching...";

            try {
                const [tHonors, uHonors, tMedals, uMedals] = await Promise.all([
                    fetch(`https://api.torn.com/v2/torn/honors?key=${apiKey}`).then(r => r.json()),
                    fetch(`https://api.torn.com/v2/user/honors?key=${apiKey}`).then(r => r.json()),
                    fetch(`https://api.torn.com/v2/torn/medals?key=${apiKey}`).then(r => r.json()),
                    fetch(`https://api.torn.com/v2/user/medals?key=${apiKey}`).then(r => r.json())
                ]);

                if (tHonors.error) throw new Error(tHonors.error.error); 

                // Tag owned IDs with their type to prevent collisions (e.g. "honor_231" and "medal_231")
                const ownedH = uHonors.honors ? uHonors.honors.map(h => 'honor_' + (typeof h === 'object' ? h.id : h)) : [];
                const ownedM = uMedals.medals ? uMedals.medals.map(m => 'medal_' + (typeof m === 'object' ? m.id : m)) : [];
                USER_OWNED_IDS = new Set([...ownedH, ...ownedM]);

                const parsedHonors = tHonors.honors.filter(m => !m.type || m.type.title.toLowerCase() !== 'default').map(m => mapItem(m, 'honor'));
                const parsedMedals = (tMedals.medals || []).map(m => mapItem(m, 'medal'));

                GLOBAL_MERITS = [...parsedHonors, ...parsedMedals];
                CATEGORIES = new Set(GLOBAL_MERITS.map(m => m.category)); 
                
                populateFilters();
                document.getElementById('filters-area').classList.remove('hidden'); 
                document.getElementById('stats-bar').classList.remove('hidden');
                renderMerits();

            } catch (error) { 
                console.error(error); alert("API Error: " + error.message); 
            } finally { 
                document.getElementById('loader').classList.add('hidden'); 
                document.getElementById('fetch-btn').disabled = false; 
                document.getElementById('fetch-btn').innerText = "Initialize Scan"; 
            }
        }

        function mapItem(item, typeStr) {
            // Find hardcoded match from JSON
            const hardcodedRecord = AWARD_DATA.find(a => a.name.toLowerCase() === item.name.toLowerCase());
            
            const baseDiff = hardcodedRecord && hardcodedRecord.difficulty ? hardcodedRecord.difficulty : 5;
            const targetImage = hardcodedRecord && hardcodedRecord.imageUrl ? hardcodedRecord.imageUrl : null;
            const crimeTag = getCrimeVersion(item.description);

            return {
                uid: typeStr + '_' + item.id, // Unique ID string to fix collision bugs
                id: item.id,
                name: item.name,
                description: item.description,
                category: typeStr === 'medal' ? 'Medal' : capitalize(item.type ? item.type.title : "Misc"),
                baseDiff: baseDiff,
                crimeVersion: crimeTag,
                awardType: typeStr,
                imgUrl: targetImage 
            };
        }

        function populateFilters() {
            const catSelect = document.getElementById('cat-filter'); 
            catSelect.innerHTML = '<option value="all">All Data</option>';
            Array.from(CATEGORIES).sort().forEach(cat => { catSelect.innerHTML += `<option value="${cat}">${cat}</option>`; });
        }

        function adjustDiff(uid, delta) {
            const merit = GLOBAL_MERITS.find(m => m.uid === uid);
            if (!merit) return;
            
            let current = USER_PREFS.customDiffs[uid];
            if (current === undefined) current = merit.baseDiff;
            
            let newDiff = current + delta;
            if (newDiff < 1) newDiff = 1;
            if (newDiff > 10) newDiff = 10;
            
            if (Number(newDiff) === Number(merit.baseDiff)) {
                delete USER_PREFS.customDiffs[uid];
            } else {
                USER_PREFS.customDiffs[uid] = Number(newDiff);
            }
            
            savePrefs();
        }

        function toggleHide(uid) {
            if (USER_PREFS.hidden.includes(uid)) {
                USER_PREFS.hidden = USER_PREFS.hidden.filter(h => h !== uid);
            } else {
                USER_PREFS.hidden.push(uid);
            }
            savePrefs();
        }

        function renderMerits() {
            const listDiv = document.getElementById('merit-list');
            const hideOwned = document.getElementById('hide-owned').checked;
            const showHidden = document.getElementById('show-hidden').checked;
            const catFilter = document.getElementById('cat-filter').value;
            const sortFilter = document.getElementById('sort-filter').value;
            const crimeFilter = document.getElementById('crime-filter').value;
            
            let filtered = GLOBAL_MERITS.filter(m => {
                const isHidden = USER_PREFS.hidden.includes(m.uid);
                if (!showHidden && isHidden) return false;
                if (showHidden && !isHidden) return false;

                if (hideOwned && USER_OWNED_IDS.has(m.uid)) return false;
                if (catFilter !== 'all' && m.category !== catFilter) return false;
                
                if (crimeFilter === 'crime1' && m.crimeVersion !== 1) return false;
                if (crimeFilter === 'crime2' && m.crimeVersion !== 2) return false;
                if (crimeFilter === 'nocrime' && m.crimeVersion !== null) return false;

                return true;
            });

            filtered.forEach(m => {
                if (USER_PREFS.customDiffs[m.uid] !== undefined) {
                    if (Number(USER_PREFS.customDiffs[m.uid]) === Number(m.baseDiff)) {
                        delete USER_PREFS.customDiffs[m.uid];
                        m.displayDiff = m.baseDiff;
                        m.isCustom = false;
                    } else {
                        m.displayDiff = Number(USER_PREFS.customDiffs[m.uid]);
                        m.isCustom = true;
                    }
                } else {
                    m.displayDiff = m.baseDiff;
                    m.isCustom = false;
                }
            });

            document.getElementById('total-count').innerText = `${filtered.length} Targets`;
            document.getElementById('completion-rate').innerText = `${filtered.length} Pending`;

            filtered.sort((a, b) => {
                if (sortFilter === 'name') return a.name.localeCompare(b.name);
                if (sortFilter === 'difficulty_asc') return a.displayDiff - b.displayDiff;
                if (sortFilter === 'difficulty_desc') return b.displayDiff - a.displayDiff;
                return 0;
            });

            if (filtered.length === 0) { 
                document.getElementById('empty-state').classList.remove('hidden'); 
                listDiv.innerHTML = '';
                return; 
            } else { 
                document.getElementById('empty-state').classList.add('hidden'); 
            }

            let htmlBuffer = '';

            filtered.forEach(m => {
                const isOwned = USER_OWNED_IDS.has(m.uid);
                const isHidden = USER_PREFS.hidden.includes(m.uid);
                const opacityClass = isOwned || isHidden ? 'opacity-40 grayscale' : 'opacity-100';
                
                const honorBarHtml = m.imgUrl ? `<img src="${m.imgUrl}" class="w-full mt-3 mb-3 border border-[#333] rounded object-cover h-[45px]" onerror="this.style.display='none';">` : '';
                
                // Purely restricted to Medals. Destroys itself completely on error to leave nothing behind.
                const medalIconHtml = m.awardType === 'medal' ? `
                    <div class="w-12 h-12 bg-[#111] border border-[#333] rounded flex items-center justify-center p-1.5 relative mr-3">
                        <img src="https://www.torn.com/images/awards/medals/${m.id}.png" class="w-full h-full object-contain drop-shadow-md" onerror="this.parentElement.style.display='none';">
                    </div>
                ` : '';

                htmlBuffer += `
                    <div class="torn-card relative border border-[#333] p-0 flex flex-col justify-between h-full diff-${m.displayDiff} ${opacityClass} rounded shadow-lg overflow-hidden">
                        
                        <div class="h-1.5 w-full bg-current transition-colors"></div>
                        
                        <div class="p-5 flex-grow">
                            <div class="flex justify-between items-start border-b border-[#333] pb-3 mb-3">
                                <div class="flex items-center">
                                    ${medalIconHtml}
                                    <div>
                                        <span class="text-[10px] text-[#666] font-bold block mb-1 uppercase">${m.awardType}: ${m.id}</span>
                                        <span class="text-[10px] font-bold px-1.5 py-0.5 bg-[#333] text-[#ccc] uppercase rounded">${m.category}</span>
                                    </div>
                                </div>
                                <div class="flex flex-col items-end">
                                    <span class="text-[9px] text-[#666] font-bold uppercase mb-1 tracking-wider">Diff</span>
                                    <div class="flex items-center gap-1">
                                        <button onclick="adjustDiff('${m.uid}', -1)" class="text-[#888] hover:text-white px-1 leading-none text-lg">&lsaquo;</button>
                                        <span class="text-sm font-bold bg-[#111] px-2 py-0.5 rounded border border-[#333] min-w-[30px] text-center relative">
                                            ${m.displayDiff}${m.isCustom ? '<span class="text-blue-400 absolute -top-1 -right-2 font-black text-xs">*</span>' : ''}
                                        </span>
                                        <button onclick="adjustDiff('${m.uid}', 1)" class="text-[#888] hover:text-white px-1 leading-none text-lg">&rsaquo;</button>
                                    </div>
                                </div>
                            </div>
                            
                            <h3 class="text-lg font-bold text-white tracking-tight leading-tight transition-colors">${m.name}</h3>
                            ${honorBarHtml}
                            <p class="text-[13px] text-[#999] mt-2 leading-relaxed border-l-2 border-[#444] pl-3">${m.description}</p>
                        </div>
                        
                        <div class="bg-[#111] p-3 flex justify-between items-center border-t border-[#333]">
                            ${isOwned 
                                ? '<span class="text-[10px] font-bold text-green-600 uppercase flex items-center gap-1 tracking-wider"><span class="w-2 h-2 bg-green-600 rounded-full animate-pulse"></span> ACHIEVED</span>' 
                                : '<span class="text-[10px] font-bold text-red-700 uppercase flex items-center gap-1 tracking-wider"><span class="w-2 h-2 bg-red-700 rounded-full"></span> LOCKED</span>'}
                            
                            <button onclick="toggleHide('${m.uid}')" class="text-[10px] font-bold uppercase px-3 py-1 bg-[#1a1a1a] text-[#888] hover:text-white border border-[#333] rounded transition-colors tracking-widest">
                                ${isHidden ? 'Restore' : 'Hide'}
                            </button>
                        </div>
                    </div>
                `;
            });
            
            listDiv.innerHTML = htmlBuffer;
        }
    </script>
</body>
</html>
